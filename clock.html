<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Inter","Helvetica Neue",Arial,sans-serif;--h:min(46vh,19vw)}
.fr{width:calc(100% - 8px);height:calc(100% - 8px);max-height:240px;border-top:1px solid #111;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:center;gap:2.4vw}
.flip{position:relative;width:calc(var(--h)*1.08);height:var(--h);perspective:600px;font-size:calc(var(--h)*.66);font-weight:700;color:#e6e6e6;letter-spacing:-.02em}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#262626;display:flex;justify-content:center}
.half span{display:block;height:var(--h);line-height:var(--h)}
.top{top:0;border-radius:calc(var(--h)*.11) calc(var(--h)*.11) 0 0;background:linear-gradient(#2e2e2e,#262626)}
.bot{bottom:0;border-radius:0 0 calc(var(--h)*.11) calc(var(--h)*.11);background:linear-gradient(#232323,#1d1d1d)}
.bot span{transform:translateY(-50%)}
.flap{z-index:2;transform-origin:bottom;backface-visibility:hidden}
.flap.go{animation:fl .45s ease-in forwards}
.flap2{z-index:2;bottom:0;top:auto;transform-origin:top;transform:rotateX(90deg);border-radius:0 0 calc(var(--h)*.11) calc(var(--h)*.11);background:linear-gradient(#232323,#1d1d1d)}
.flap2 span{transform:translateY(-50%)}
.flap2.go{animation:fl2 .45s .45s ease-out forwards}
@keyframes fl{to{transform:rotateX(-90deg)}}@keyframes fl2{to{transform:rotateX(0)}}
.flip::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#111;z-index:5}
.flip::before{content:"";position:absolute;inset:0;border-radius:calc(var(--h)*.11);box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:-1}
.colon{display:flex;flex-direction:column;gap:calc(var(--h)*.18)}
.colon i{width:calc(var(--h)*.07);height:calc(var(--h)*.07);border-radius:50%;background:#111}
</style></head><body>
<div class="fr"><div class="flip" id="H"></div><div class="colon"><i></i><i></i></div><div class="flip" id="M"></div><div class="colon"><i></i><i></i></div><div class="flip" id="S"></div></div>
<script>
const P=new URLSearchParams(location.search);
function build(el,v){el.dataset.v=v;el.innerHTML=`<div class="half top"><span>${v}</span></div><div class="half bot"><span>${v}</span></div>`;}
function flip(el,v){const o=el.dataset.v;if(o===v)return;el.dataset.v=v;
el.innerHTML=`<div class="half top"><span>${v}</span></div><div class="half bot"><span>${o}</span></div><div class="half top flap"><span>${o}</span></div><div class="half flap2"><span>${v}</span></div>`;
requestAnimationFrame(()=>{el.querySelector('.flap').classList.add('go');el.querySelector('.flap2').classList.add('go');});
setTimeout(()=>build(el,v),950);}
function now(){const s=new Date().toLocaleTimeString('en-GB',{timeZone:P.get('tz')||'Asia/Seoul',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});return s.split(':');}
const [h,m,sc]=now();build(H,h);build(M,m);build(S,sc);
setInterval(()=>{const [h,m,sc]=now();flip(H,h);flip(M,m);flip(S,sc);},250);
</script></body></html>
