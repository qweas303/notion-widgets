<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Header</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#191919;color-scheme:dark;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1.25fr 1.15fr;gap:18px;height:100%;padding:2px}
iframe{border:0;width:100%;height:100%;background:#191919;color-scheme:dark}
</style></head><body><div class="row">
<iframe src="date.html?v=15" title="date"></iframe>
<iframe src="clock.html?v=18" title="clock"></iframe>
<iframe src="weather.html?v=14" title="weather"></iframe>
</div></body></html>
