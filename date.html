<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="common.css?v=5">
<style>
.row{display:flex;align-items:center;gap:22px}
.day{font-size:clamp(60px,28vh,100px);line-height:.85;font-weight:200;letter-spacing:-.04em}
.right{display:flex;flex-direction:column;gap:8px}
.month{font-size:clamp(18px,7vh,26px);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.ko{font-size:13px;color:#7a7a7a;font-weight:500}
</style></head><body>
<div class="card"><div class="row"><div class="day" id="d">--</div>
<div class="right"><div class="label" id="w">WEEKDAY</div><div class="month" id="m"></div><div class="ko" id="k"></div></div></div></div>
<script>
function draw(){const n=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
d.textContent=String(n.getDate()).padStart(2,'0');
w.textContent=n.toLocaleDateString('en-US',{weekday:'long'});
m.textContent=n.toLocaleDateString('en-US',{month:'long'})+' '+n.getFullYear();
k.textContent=n.getFullYear()+'. '+(n.getMonth()+1)+'. '+n.getDate()+'. '+'일월화수목금토'[n.getDay()]+'요일';}
draw();setInterval(draw,30000);
</script></body></html>
