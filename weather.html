<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="common.css?v=11">
<style>
.top{display:flex;align-items:center;gap:16px}
.icon{width:52px;height:52px;flex:none}
.temp{font-size:58px;line-height:.9;font-weight:200;letter-spacing:-.04em}
.temp sup{font-size:.4em;vertical-align:top;margin-left:2px;color:#777}
.info{display:flex;flex-direction:column;gap:6px;margin-left:auto;text-align:right}
.desc{font-size:15px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;border-top:1px solid #2e2e2e}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.day+.day{border-left:1px solid #262626}
.day svg{width:30px;height:30px}
.dn{font-size:11px;letter-spacing:.06em;color:#8c8c8c;font-weight:600}
.dt{font-size:14px;font-weight:600}.dt i{font-style:normal;color:#999}
</style></head><body>
<div class="card">
<div class="top">
<svg class="icon" id="ic" viewBox="0 0 64 64" fill="none" stroke="#f2f2f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg>
<div class="temp" id="t">--<sup>°</sup></div>
<div class="info"><div class="label" id="city">SEOUL</div><div class="desc" id="ds">불러오는 중</div></div>
</div>
<div class="days" id="days"></div>
</div>
<script>
const P=new URLSearchParams(location.search),lat=P.get('lat')||37.5665,lon=P.get('lon')||126.978;
if(P.get('city'))city.textContent=P.get('city');
const sun='<circle cx="32" cy="32" r="10"/><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16.4 16.4l4.3 4.3M43.3 43.3l4.3 4.3M16.4 47.6l4.3-4.3M43.3 20.7l4.3-4.3"/>';
const moon='<path d="M42 40A16 16 0 0 1 26 18a16 16 0 1 0 16 22z"/>';
const cloud='<path d="M20 46h26a9 9 0 0 0 0-18 13 13 0 0 0-25-3A10 10 0 0 0 20 46z"/>';
const I={clear:d=>d?sun:moon,partly:d=>(d?'<g transform="translate(-6 -8) scale(.75)">'+sun+'</g>':'<g transform="translate(-4 -6) scale(.7)">'+moon+'</g>')+cloud,
cloud:()=>cloud,fog:()=>'<path d="M14 26h36M10 34h44M16 42h32"/>',
rain:()=>'<g transform="translate(0 -6)">'+cloud+'</g><path d="M24 46l-3 7M33 46l-3 7M42 46l-3 7"/>',
snow:()=>'<g transform="translate(0 -6)">'+cloud+'</g><path d="M24 48v.1M32 52v.1M40 48v.1M28 56v.1M36 56v.1" stroke-width="4"/>',
storm:()=>'<g transform="translate(0 -6)">'+cloud+'</g><path d="M33 42l-5 8h7l-4 8"/>'};
function map(c){if(c==0)return['clear','맑음'];if(c<=2)return['partly','구름 조금'];if(c==3)return['cloud','흐림'];if(c<=48)return['fog','안개'];
if(c<=67||(c>=80&&c<=82))return['rain',c>=80?'소나기':'비'];if(c<=77||c==85||c==86)return['snow','눈'];return['storm','뇌우'];}
const svg=(k,d)=>`<svg viewBox="0 0 64 64" fill="none" stroke="#f2f2f2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${I[k](d)}</svg>`;
function render(cur,daily){const [k,txt]=map(cur.code);
ic.innerHTML=I[k](cur.day);t.innerHTML=Math.round(cur.temp)+'<sup>°</sup>';ds.textContent=txt;
days.innerHTML=daily.map((d,i)=>{const [kk]=map(d.code);
const nm=i==0?'오늘':i==1?'내일':'일월화수목금토'[new Date(d.date+'T00:00:00').getDay()]+'요일';
return `<div class="day"><div class="dn">${nm}</div>${svg(kk,1)}<div class="dt">${Math.round(d.max)}° <i>/ ${Math.round(d.min)}°</i></div></div>`}).join('');}
function tfetch(u,ms){const c=new AbortController();const id=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal,cache:'no-store'}).finally(()=>clearTimeout(id));}
async function fromOpenMeteo(){const r=await tfetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=3`,8000);
 if(!r.ok)throw 0;const j=await r.json(),D=j.daily;
 return {cur:{temp:j.current.temperature_2m,code:j.current.weather_code,day:j.current.is_day},daily:D.time.map((d,i)=>({date:d,code:D.weather_code[i],max:D.temperature_2m_max[i],min:D.temperature_2m_min[i]}))};}
const W2C=c=>{c=+c;if(c==113)return 0;if(c==116)return 2;if(c==119||c==122)return 3;if([143,248,260].includes(c))return 45;if([200,386,389,392,395].includes(c))return 95;
 if([179,182,185,227,230,317,320,323,326,329,332,335,338,350,368,371,374,377].includes(c))return 73;return 61;};
async function fromWttr(){const r=await tfetch('https://wttr.in/'+lat+','+lon+'?format=j1',9000);if(!r.ok)throw 0;const j=await r.json(),c=j.current_condition[0];
 const h=new Date().getHours();return {cur:{temp:+c.temp_C,code:W2C(c.weatherCode),day:h>=6&&h<18?1:0},
 daily:j.weather.slice(0,3).map(w=>({date:w.date,code:W2C(w.hourly[4].weatherCode),max:+w.maxtempC,min:+w.mintempC}))};}
async function load(){let d=null;
 for(const f of [fromOpenMeteo,fromWttr,fromOpenMeteo]){try{d=await f();break;}catch(e){}}
 if(d){render(d.cur,d.daily);try{localStorage.setItem('wx',JSON.stringify({t:Date.now(),d}))}catch(e){}return true;}
 try{const c=JSON.parse(localStorage.getItem('wx'));if(c){render(c.d.cur,c.d.daily);return false;}}catch(e){}
 ds.textContent='날씨 연결 재시도 중';return false;}
async function boot(){const ok=await load();setTimeout(boot,ok?15*60*1000:60*1000);}
boot();
</script></body></html>
