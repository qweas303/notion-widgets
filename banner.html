<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:170px;background:transparent}
.card{width:1200px;height:170px;border-radius:18px;background:linear-gradient(160deg,#2b2b2b 0%,#1a1a1a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif}
.label{display:flex;align-items:center;gap:18px;font-family:"Cormorant Garamond",Georgia,"DejaVu Serif",serif;font-size:13px;letter-spacing:.5em;color:#a89a74;font-weight:600}
.label i{display:block;width:70px;height:1px;background:linear-gradient(90deg,transparent,#a89a74)}
.label i:last-child{background:linear-gradient(270deg,transparent,#a89a74)}
.title{font-size:66px;font-weight:700;color:#f1f1f1;letter-spacing:.14em;line-height:1;padding-left:.14em}
.title b{color:#c9b37e;font-weight:500;margin-left:.04em}
</style></head><body><div class="card">
<div class="label"><i></i>ATTENDANCE CHECK<i></i></div>
<div class="title">전자출결<b>!</b></div>
</div></body></html>
